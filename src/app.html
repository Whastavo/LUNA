<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="description" content="Luna es una compañera de IA con avatares VRM 3D, chat por voz, memoria semántica y soporte multi-proveedor de LLM. Privacidad primero." />

		<meta property="og:type" content="website" />
		<meta property="og:title" content="Luna" />
		<meta property="og:description" content="Luna es una compañera de IA con avatares VRM 3D, chat por voz, memoria semántica y soporte multi-proveedor de LLM. Privacidad primero." />
		<meta property="og:image" content="https://luna.ai/brand-assets/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />

		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Luna" />
		<meta name="twitter:description" content="Luna es una compañera de IA con avatares VRM 3D, chat por voz, memoria semántica y soporte multi-proveedor de LLM. Privacidad primero." />
		<meta name="twitter:image" content="https://luna.ai/brand-assets/og-image.png" />

		<link rel="icon" href="/favicon-light.png" type="image/png" media="(prefers-color-scheme: light)" />
		<link rel="icon" href="/favicon-dark.png" type="image/png" media="(prefers-color-scheme: dark)" />

		<!-- Fuente crítica del hero: se precarga ANTES del CSS que la declara.
		   Sin esto, el descubrimiento era css→@font-face (cadena de 2 saltos)
		   y el texto del hero pintaba con la fuente fallback hasta que Inter
		   llegaba — el salto de tamaño que el usuario veía al terminar de
		   cargar. Solo el subset latin (48KB, variable): cubre todo el
		   español; latin-ext queda bajo demanda vía unicode-range. El
		   crossorigin es obligatorio aunque sea same-origin: las fuentes se
		   descargan en modo CORS y sin él el preload se duplica. -->
		<link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="stylesheet" href="/fonts/inter.css" />
		<script src="/boot/luna-boot.js"></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
