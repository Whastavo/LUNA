<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Luna es un compañero IA de código abierto con avatares 3D VRM, chat de voz, memoria semántica y soporte multi-proveedor LLM. Ejecutable en local y enfocado en la privacidad." />

		<!-- Open Graph -->
		<meta property="og:type" content="website" />
		<meta property="og:title" content="Luna" />
		<meta property="og:description" content="Luna es un compañero IA de código abierto con avatares 3D VRM, chat de voz, memoria semántica y soporte multi-proveedor LLM. Ejecutable en local y enfocado en la privacidad." />
		<meta property="og:image" content="https://luna.ai/brand-assets/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />

		<!-- Twitter Card -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Luna" />
		<meta name="twitter:description" content="Luna es un compañero IA de código abierto con avatares 3D VRM, chat de voz, memoria semántica y soporte multi-proveedor LLM. Ejecutable en local y enfocado en la privacidad." />
		<meta name="twitter:image" content="https://luna.ai/brand-assets/og-image.png" />

		<link rel="icon" href="/favicon-light.png" type="image/png" media="(prefers-color-scheme: light)" />
		<link rel="icon" href="/favicon-dark.png" type="image/png" media="(prefers-color-scheme: dark)" />
		<script>
			(function() {
				// Prevent "TypeError: Cannot set property fetch of #<Window> which has only a getter"
				try {
					let _fetch = window.fetch;
					if (_fetch) {
						Object.defineProperty(window, 'fetch', {
							get() { return _fetch; },
							set(fn) { _fetch = fn; },
							configurable: true,
							enumerable: true
						});
					}
				} catch (e) {}

				const colorMode = localStorage.getItem('colorMode') || 'system';
				let shouldBeDark;
				if (colorMode === 'system') {
					shouldBeDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
				} else {
					shouldBeDark = colorMode === 'dark';
				}
				if (shouldBeDark) {
					document.documentElement.classList.add('dark');
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
